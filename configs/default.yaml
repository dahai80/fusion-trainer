# Fusion-Trainer Default Configuration
# ======================================
# This is the base configuration shared by all training methods.
# Method-specific overrides are in sft_*.yaml and rlsl_*.yaml.

# ----------- Dataset -----------
dataset:
  format: jsonl
  train_split: train
  val_split: val
  val_ratio: 0.05
  max_samples: 0
  max_seq_length: 4096
  min_seq_length: 2
  remove_duplicates: true
  input_field: input
  output_field: output

# ----------- Hardware -----------
device: gpu
seed: 42

# ----------- Paths -----------
model_hub_path: ""  # defaults to $FUSION_MODEL_HUB or ~/fusion-model-hub (read-only reference)
cache_path: ""  # defaults to ./runtime_cache