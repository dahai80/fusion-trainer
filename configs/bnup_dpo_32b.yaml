# BNUP DPO Configuration — Stage 2 Preference Alignment (issue #59)
# ====================================================================
# Target: Qwen2.5-32B-Instruct, DPO on SFT output adapter
# Method: DPO (beta=0.1, sigmoid loss)
# Data: output of `ft bnup-prep --dpo` (ShareGPT preference pairs)
#
# NOTE on adapter chaining: fusion-mlx's DPO endpoint (dpo_service.py:271)
# loads the base model without adapter_path — DPO trains a fresh LoRA,
# NOT chained on the SFT adapter. Upstream gap filed (fusion-mlx #1149).
# The pipeline runs SFT and DPO as sequential independent stages, then
# merges the DPO adapter. When upstream lands adapter_path support, the
# pipeline will pass the SFT adapter_name for true chaining.

rlsl:
  method: dpo
  beta: 0.1  # DPO temperature (spec: dpo_beta=0.1, dpo_loss_type=sigmoid)

  # Training hyperparameters (spec §"阶段2 DPO配置")
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-6
  num_epochs: 2
  max_seq_length: 4096  # cutoff_len

  # Logging
  log_every: 5
  save_every: 50
  run_name: bnup_dpo_32b
  output_dir: ""

# SFT model — DPO uses the same base model id
sft:
  model: ""  # same as bnup_sft_32b.yaml (fusion-mlx alias)
  lora_rank: 16
  lora_alpha: 32.0
  lora_dropout: 0.05

# Dataset — BNUP DPO pairs from bnup_dpo_prep
dataset:
  hub_dataset: ""  # e.g. "dpo/bnup_math_dpo"
  max_seq_length: 4096
