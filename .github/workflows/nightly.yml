# Nightly real-training regression run (issue #75).
#
# The per-push CI (ci.yml) runs the mocked suite on ubuntu — MLX has no
# Linux wheel, so every test that needs a live fusion-mlx engine is
# env-gated (FUSION_TRAINER_REAL=1) and silently skipped there. That let
# real-loop regressions (upstream field renames, job-lifecycle changes)
# land unnoticed for weeks. This workflow ungates them for real: it boots
# a real fusion-mlx on a macOS arm64 runner with a tiny 0.6B model and
# runs the real-training + contract suites against actual gradient loops.
#
# Cost note: macos runners are ~10x ubuntu minutes. The model is 0.6B-4bit
# (~400 MB) and each SFT job is a handful of steps, so the whole run stays
# well under the default 6h job limit.

name: nightly

on:
  schedule:
    # 18:30 UTC = 02:30 Beijing — off-peak, results ready for the morning.
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-training:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      FUSION_TRAINER_REAL: "1"
      # 7GB runner + loaded engine leaves ~2.7GB available — below the guard's
      # 4GB runtime-overhead constant even for the 0.6B test model. Opt out
      # here; the gate stays active for operator machines.
      FUSION_TRAINER_MEMORY_GUARD: "off"
      FUSION_MLX_PORT: "11434"
      # Tiny model: real MLX training loop, minutes not hours.
      FUSION_MLX_ADMIN_TOKEN: ci-nightly-admin-key
      # huggingface_hub reads HF_ENDPOINT (hf-mirror.com is the project's
      # download mirror); HF_MIRROR kept for fusion-mlx's own download path.
      HF_ENDPOINT: https://hf-mirror.com
      HF_MIRROR: https://hf-mirror.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fusion-trainer (dev) + fusion-mlx
        run: |
          python -m pip install --upgrade pip
          # Base (slim) install on purpose: fusion-mlx#1403/#1406 (0.10.17)
          # made the turboquant attention patch pass through without
          # mlx_vlm — before that, DPO/ORPO/reward jobs died with
          # "No module named 'mlx_vlm'" (run 40196088382). Running slim
          # here keeps the slim path regression-covered in CI.
          pip install "fusion-mlx>=0.10.17"
          # fusion-core is not on PyPI — install the pinned git tag before
          # the package so the version-only constraint resolves (#81).
          pip install "fusion-core @ git+https://github.com/dahai80/fusion-core.git@v0.10.0"
          pip install -e ".[dev]"

      - name: Pull test model
        run: |
          # Full HF path, not the alias: run 40194017356 showed
          # `serve --model <alias>` hands the RAW alias to huggingface_hub's
          # snapshot_download (repo "qwen3-0.6b-4bit" does not exist → 401,
          # misreported as "gated"). The pull path resolves aliases; serve's
          # pre-download check does not. The suites hardcode the served id
          # "Qwen3-0.6B-4bit", which --served-model-name pins below so
          # /v1/models and the fine-tune pool key match exactly.
          fusion-mlx pull mlx-community/Qwen3-0.6B-4bit

      - name: Provision engine settings (known admin key)
        # fusion-mlx's admin router (fine-tune jobs live under it) is
        # fail-closed: a Bearer must match settings.json auth.api_key. A
        # fresh install has no key, so every fine-tune call would 401.
        # Write a known key so the suites' FUSION_MLX_ADMIN_TOKEN works.
        run: |
          # engine-pool model discovery (engine_pool._scan_models) hard-fails
          # when ~/.fusion-mlx/models does not exist — a fresh runner never
          # has it (run 40194670006). Create it up front.
          mkdir -p ~/.fusion-mlx/models
          cat > ~/.fusion-mlx/settings.json <<'EOF'
          {
            "auth": {
              "api_key": "ci-nightly-admin-key"
            },
            "huggingface": {
              "endpoint": "https://hf-mirror.com"
            }
          }
          EOF

      - name: Boot fusion-mlx
        run: |
          # --profile standard, explicit: the runner's RAM (< 24 GB) makes
          # hardware auto-detect pick "lite", which disables the "tools"
          # modality — the convert router (/v1/merge-adapter) is then not
          # mounted and the merge contract test 404s (run 40197181739).
          nohup fusion-mlx serve --model mlx-community/Qwen3-0.6B-4bit \
            --served-model-name Qwen3-0.6B-4bit --profile standard \
            --port 11434 \
            > /tmp/fusion-mlx.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -H "Authorization: Bearer ci-nightly-admin-key" \
                http://localhost:11434/v1/models > /dev/null 2>&1; then
              echo "fusion-mlx healthy after ${i} polls"
              exit 0
            fi
            sleep 5
          done
          echo "fusion-mlx failed to become healthy"
          cat /tmp/fusion-mlx.log
          exit 1

      - name: Real-training suite
        run: |
          pytest tests/test_sft_trainer.py::TestRealFusionMLXIntegration -v

      - name: Contract suite
        run: |
          pytest tests/test_contract_integration.py -v -m integration

      # Phase-2 promotion line (#134): run the eval-gated promotion cycle
      # unattended — a tiny real SFT round, a Wilson-CI eval-gate decision
      # recorded into a scratch flywheel registry, and a claims-registry row
      # appended for the decision (register-before-use, C-1). Fails the
      # nightly when the promotion path regresses.
      - name: Promotion cycle smoke (#134)
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from fusion_trainer.flywheel import record_round, format_status

          tmp = Path("runtime_cache/promote_smoke")
          tmp.mkdir(parents=True, exist_ok=True)
          cache = str(tmp)
          claims = tmp / "claims.md"
          claims.write_text(
              "| ID | Date | Claim | Evidence | Status | Review |\n"
              "|----|------|-------|----------|--------|--------|\n",
              encoding="utf-8",
          )

          def summary(run_id, passed, total=30):
              p = tmp / f"{run_id}-summary.json"
              p.write_text(json.dumps({
                  "run_id": run_id,
                  "models": {"ci": "Qwen3-0.6B-4bit-fused"},
                  "arms": {"ci": {"total": total, "passed": passed,
                                  "pass_rate": passed / total,
                                  "by_type": {}}},
              }), encoding="utf-8")
              return p

          record_round(cache, label="baseline", checkpoint="base",
                       summary_path=summary("b", 15), baseline=True)
          e = record_round(cache, label="round-1", checkpoint="adp",
                           summary_path=summary("r1", 28), run_id="smoke-1",
                           gate=True, gate_mode="wilson",
                           claims_registry=claims)
          assert e["status"] == "promoted", e
          assert e["claims_row"] == "CL-001", e
          e2 = record_round(cache, label="round-2", checkpoint="adp2",
                            summary_path=summary("r2", 16), run_id="smoke-2",
                            gate=True, gate_mode="wilson",
                            claims_registry=claims)
          assert e2["status"] == "discarded", e2
          print(format_status(cache))
          print("promotion cycle smoke: OK (#134)")
          PY

      - name: Dump engine log on failure
        if: failure()
        run: tail -200 /tmp/fusion-mlx.log || true
